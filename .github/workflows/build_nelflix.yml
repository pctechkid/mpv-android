name: Build Nelflix mpv library

on:
  push:
    branches:
      - codex/opaque-box-style-runs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: gh-cache/
          key: "nelflix-prefix-${{ hashFiles('buildscripts/**') }}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build python3-pip
          sudo pip3 install meson

      - name: Download and patch dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build universal Android AAR
        run: |
          set -euxo pipefail
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./buildall.sh --arch x86 mpv
          ./buildall.sh --arch x86_64 mpv
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-android-lib-nelflix-0.1.9
          path: app/build/outputs/aar/app-release.aar
          if-no-files-found: error
